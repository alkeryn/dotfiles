listener {
    timeout = 600
    # NB: with a Lua config `hyprctl dispatch` takes a Lua expression (hl.dispatch(...)),
    # the old `dispatch dpms off` form is a syntax error
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "off" })'
    # on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
}
